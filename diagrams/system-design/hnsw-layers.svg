<circle cx="560" cy="186" r="3.5" fill="#f59e0b"/>
<circle cx="560" cy="296" r="3.5" fill="#f59e0b"/>
<rect x="868" y="70" width="96" height="38" rx="9" fill="#fffbeb" stroke="#f59e0b"/>
<text x="916" y="88" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="bold" fill="#78350f">query</text>
<text x="916" y="101" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#92400e">k=10, ef=64</text>
<line x1="868" y1="89" x2="520" y2="89" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M604 302 L640 322 L660 330" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#hnsw-green)"/>
<rect x="666" y="326" width="120" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
<text x="726" y="347" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#064e3b">10 nearest</text>
<text x="40" y="404" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748b">· Each layer keeps M=16 links; upper layers are sampled subsets, so a hop there covers distance cheaply.</text>
<text x="40" y="424" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748b">· Descent is greedy: keep the closest neighbour, drop a layer when no neighbour improves, refine at layer 0.</text>
<text x="40" y="444" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748b">· Search cost is O(log N) hops plus ef·M distance computations at the base layer — recall is tuned by ef.</text>
<defs><marker id="hnsw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><marker id="hnsw-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker></defs>
</svg>
