name: Docs & Diagrams Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Markdown content audit (fences, headings, links, JS execution)
        run: node tools/audit-docs.mjs

      - name: Archify spec validation (41 diagrams, showcase quality)
        run: |
          if node tools/archify-all.mjs validate; then
            echo "Archify validation passed"
          else
            echo "::warning::Archify validation could not run (skill not installed on runner) or found issues"
          fi
