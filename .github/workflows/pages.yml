# Publishes the diagrams site by force-pushing ./site to the gh-pages branch.
# Pages source: Settings → Pages → Build and deployment → Deploy from a branch
#               → gh-pages / (root)
name: pages
on:
  push:
    branches: [master]
    paths:
      - 'diagrams/**'
      - 'tools/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # push the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-pages.mjs
      - name: Publish to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          find . -mindepth 1 -maxdepth 1 -not -name site -not -name .git -exec rm -rf {} +
          git add -A
          git commit -q -m "Deploy diagrams site from ${GITHUB_SHA}"
          git push --force origin gh-pages
