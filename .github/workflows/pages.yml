# Publishes the diagrams site by force-pushing ./site to the gh-pages branch.
# Pages source: Settings → Pages → Build and deployment → Deploy from a branch
#               → gh-pages / (root)
name: pages
on:
  push:
    branches: [master]
    paths:
      - 'diagrams/**'
      - 'tools/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # push the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-pages.mjs
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "aishwary11"
          git config user.email "aishwary46@gmail.com"
          cd site
          touch .nojekyll
          git init -q -b gh-pages .
          git add -A
          git commit -q -m "Deploy diagrams site from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
