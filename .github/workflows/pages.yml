name: pages
on:
  push:
    branches: [master]
    paths:
      - 'diagrams/**'
      - 'tools/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write   # lets configure-pages flip the one-time Pages enablement

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-pages.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # create the Pages site with source=GitHub Actions if missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# Pages site: https://aishwary11.github.io/system-design/
# Pages site: https://aishwary11.github.io/system-design/ (deploy: GitHub Actions -> pages workflow)
